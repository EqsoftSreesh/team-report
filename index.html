<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Daily Team Standup Tracker — Replace your notepad with a fast, searchable, exportable standup report system.">
  <title>Team Standup Tracker</title>

  <!-- Google Font: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- External Libraries (CDN) -->
  <!-- Dexie.js — IndexedDB wrapper -->
  <script src="https://unpkg.com/dexie@3.2.7/dist/dexie.js"></script>
  <!-- jsPDF — PDF generation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js"></script>
  <!-- SheetJS — Excel generation -->
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>

  <!-- App Styles -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app">
    <!-- ===== Header ===== -->
    <header class="app-header" id="app-header">
      <!-- Rendered by app.js -->
    </header>

    <!-- ===== Tab Navigation ===== -->
    <nav class="tab-nav" id="main-nav">
      <button class="tab-btn active" data-tab="entry">
        <span class="tab-icon">📝</span>
        <span class="tab-label">Entry</span>
      </button>
      <button class="tab-btn" data-tab="daily">
        <span class="tab-icon">📊</span>
        <span class="tab-label">Daily View</span>
      </button>
      <button class="tab-btn" data-tab="calendar">
        <span class="tab-icon">📅</span>
        <span class="tab-label">Calendar</span>
      </button>
      <button class="tab-btn" data-tab="carryover">
        <span class="tab-icon">🔄</span>
        <span class="tab-label">Carry-Over</span>
      </button>
      <button class="tab-btn" data-tab="search">
        <span class="tab-icon">🔍</span>
        <span class="tab-label">Search</span>
      </button>
      <button class="tab-btn" data-tab="issues" style="position:relative;">
        <span class="tab-icon">⚠️</span>
        <span class="tab-label">Issues</span>
        <span class="badge" id="issue-badge" style="display:none;">0</span>
      </button>
      <button class="tab-btn" data-tab="export">
        <span class="tab-icon">📤</span>
        <span class="tab-label">Export</span>
      </button>
      <button class="tab-btn" data-tab="members">
        <span class="tab-icon">👥</span>
        <span class="tab-label">Members</span>
      </button>
    </nav>

    <!-- ===== Tab Panels ===== -->
    <main>
      <div class="tab-panel active" id="panel-entry"></div>
      <div class="tab-panel" id="panel-daily"></div>
      <div class="tab-panel" id="panel-calendar"></div>
      <div class="tab-panel" id="panel-carryover"></div>
      <div class="tab-panel" id="panel-search"></div>
      <div class="tab-panel" id="panel-issues"></div>
      <div class="tab-panel" id="panel-export"></div>
      <div class="tab-panel" id="panel-members"></div>
    </main>
  </div>

  <!-- ===== Modal Overlay ===== -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal"></div>
  </div>

  <!-- ===== Toast Notifications ===== -->
  <div class="toast-container" id="toast-container"></div>

  <!-- ===== App Scripts (order matters) ===== -->
  <script src="js/db.js"></script>
  <script src="js/app.js"></script>
  <script src="js/entry.js"></script>
  <script src="js/daily-view.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/search.js"></script>
  <script src="js/issues.js"></script>
  <script src="js/export.js"></script>
  <script src="js/members.js"></script>
  <script src="js/carryover.js"></script>
</body>
</html>
